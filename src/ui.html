<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      margin: 0;
      padding: 20px;
      background: #ffffff;
      color: #333;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    .header p {
      font-size: 13px;
      color: #666;
      margin: 0;
    }
    .upload-area {
      border: 2px dashed #e0e0e0;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: #18a0fb;
      background: #f0f9ff;
    }
    .upload-area .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .upload-area .text {
      font-size: 14px;
      color: #666;
    }
    .upload-area .subtext {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    #fileInput {
      display: none;
    }
    .progress-container {
      display: none;
      margin-bottom: 16px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      background: #18a0fb;
      width: 0%;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 12px;
      color: #666;
      text-align: center;
    }
    .file-info {
      display: none;
      background: #f8f8f8;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .file-info .name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .file-info .details {
      font-size: 12px;
      color: #666;
    }
    .button {
      width: 100%;
      padding: 10px 16px;
      background: #18a0fb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .button:hover {
      background: #0d8ce0;
    }
    .button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .error {
      display: none;
      background: #fff2f2;
      border: 1px solid #ffcccc;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #d32f2f;
    }
    .success {
      display: none;
      background: #f0fff4;
      border: 1px solid #c6f6d5;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #22543d;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>PSD to Figma Importer</h1>
      <p>Import Photoshop files as editable Figma layers</p>
    </div>

    <div class="upload-area" id="uploadArea">
      <div class="icon">📁</div>
      <div class="text">Drop your PSD file here</div>
      <div class="subtext">or click to browse</div>
    </div>
    <input type="file" id="fileInput" accept=".psd,.psb">

    <div class="file-info" id="fileInfo">
      <div class="name" id="fileName"></div>
      <div class="details" id="fileDetails"></div>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Processing...</div>
    </div>

    <div class="error" id="errorBox"></div>
    <div class="success" id="successBox"></div>

    <button class="button" id="importBtn" disabled>Import to Figma</button>
  </div>

  <script src="https://unpkg.com/psd.js@3.7.0/dist/psd.min.js"></script>
  <script>
    let psdData = null;
    let fileBuffer = null;

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileDetails = document.getElementById('fileDetails');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const importBtn = document.getElementById('importBtn');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');

    uploadArea.addEventListener('click', () => fileInput.click());
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      successBox.style.display = 'none';
    }

    function showSuccess(msg) {
      successBox.textContent = msg;
      successBox.style.display = 'block';
      errorBox.style.display = 'none';
    }

    function hideMessages() {
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
    }

    async function handleFile(file) {
      hideMessages();
      
      if (!file.name.toLowerCase().endsWith('.psd') && !file.name.toLowerCase().endsWith('.psb')) {
        showError('Please select a valid PSD or PSB file.');
        return;
      }

      try {
        progressContainer.style.display = 'block';
        setProgress(10, 'Reading file...');

        fileBuffer = await file.arrayBuffer();
        
        setProgress(30, 'Parsing PSD...');

        psdData = PSD.fromArrayBuffer(fileBuffer);
        psdData.parse();

        setProgress(60, 'Analyzing layers...');

        const image = psdData.image;
        const width = image.cols;
        const height = image.rows;

        setProgress(100, 'Ready to import');

        fileName.textContent = file.name;
        fileDetails.textContent = `${width} × ${height}px | ${formatFileSize(file.size)}`;
        fileInfo.style.display = 'block';
        importBtn.disabled = false;

        showSuccess(`PSD loaded successfully: ${width} × ${height}px`);

      } catch (err) {
        console.error('Error parsing PSD:', err);
        showError(`Failed to parse PSD: ${err.message}`);
        progressContainer.style.display = 'none';
        importBtn.disabled = true;
      }
    }

    function setProgress(percent, text) {
      progressFill.style.width = percent + '%';
      progressText.textContent = text;
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    importBtn.addEventListener('click', async () => {
      if (!psdData) return;

      hideMessages();
      importBtn.disabled = true;
      progressContainer.style.display = 'block';
      setProgress(0, 'Preparing data...');

      try {
        const exportData = exportPsdData(psdData);
        
        setProgress(50, 'Sending to Figma...');

        parent.postMessage({ 
          pluginMessage: { 
            type: 'import-psd', 
            data: exportData 
          } 
        }, '*');

        setProgress(100, 'Importing...');

      } catch (err) {
        console.error('Error exporting PSD data:', err);
        showError(`Import failed: ${err.message}`);
        importBtn.disabled = false;
      }
    });

    function exportPsdData(psd) {
      const root = psd.tree();
      const image = psd.image;
      
      const data = {
        width: image.cols,
        height: image.rows,
        children: []
      };

      function processNode(node) {
        const result = {
          name: node.get('name') || 'Layer',
          left: node.get('left') || 0,
          top: node.get('top') || 0,
          right: node.get('right') || 0,
          bottom: node.get('bottom') || 0,
          opacity: (node.get('opacity') || 255) / 255,
          visible: node.get('visible') !== false,
          type: 'group',
          children: []
        };

        result.width = result.right - result.left;
        result.height = result.bottom - result.top;

        if (node.isLayer) {
          result.type = 'layer';
          
          const textData = node.get('text');
          if (textData) {
            result.type = 'text';
            result.text = {
              content: textData.text || '',
              style: extractTextStyle(textData)
            };
          }

          const imageData = node.get('image');
          if (imageData && !textData) {
            result.type = 'image';
            try {
              const pngData = node.image.toBase64();
              result.imageData = pngData;
            } catch (e) {
              console.warn('Could not extract image:', e);
            }
          }

          const blendOptions = node.get('blendOptions');
          if (blendOptions) {
            result.blendMode = blendOptions.mode;
          }
        }

        if (node.children && node.children.length > 0) {
          result.children = node.children.map(child => processNode(child));
        }

        return result;
      }

      if (root.children) {
        data.children = root.children.map(child => processNode(child));
      }

      return data;
    }

    function extractTextStyle(textData) {
      const style = textData.style || {};
      const paragraphStyle = style.paragraphStyle || {};
      
      return {
        fontSize: style.fontSize || 16,
        fontFamily: style.fontName || 'Arial',
        fontWeight: style.fontWeight || 'normal',
        fillColor: textData.style?.fillColor || null,
        alignment: paragraphStyle.alignment || 'left',
        lineHeight: style.lineHeight || null,
        letterSpacing: style.letterSpacing || null
      };
    }

    window.onmessage = (event) => {
      const pluginMessage = event.data.pluginMessage;
      if (pluginMessage) {
        if (pluginMessage.type === 'import-success') {
          showSuccess(`Import completed! Created ${pluginMessage.nodeCount} nodes.`);
          progressContainer.style.display = 'none';
          importBtn.disabled = false;
        } else if (pluginMessage.type === 'import-error') {
          showError(`Import error: ${pluginMessage.error}`);
          progressContainer.style.display = 'none';
          importBtn.disabled = false;
        }
      }
    };
  </script>
</body>
</html>
